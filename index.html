<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8f9aa3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Egg" />
  <meta name="description" content="Egg." />
  <title>Egg</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The whole thing lives inside one crude "application window" -->
  <div id="desk">
    <div id="window" class="window" role="application" aria-label="Egg">
      <!-- title bar -->
      <div class="titlebar">
        <div class="closebox" aria-hidden="true"></div>
        <div class="titlebar-lines" aria-hidden="true"></div>
        <div class="title">Egg</div>
        <div class="titlebar-lines" aria-hidden="true"></div>
      </div>

      <!-- menu-ish strip -->
      <div class="menubar" aria-hidden="true">
        <span>File</span><span>Egg</span><span>Special</span>
      </div>

      <div id="stage" class="stage">
        <!-- header -->
        <div id="feed-title" class="feed-title">FEED EGGS</div>

        <!-- counter readout -->
        <div class="counter-wrap">
          <div id="counter" class="counter">0 EGGS</div>
        </div>

        <!-- Eggman -->
        <div id="eggman-area" class="eggman-area">
          <svg id="eggman" class="eggman" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" aria-label="Eggman">
            <!-- FRONT view -->
            <g id="eg-front">
              <!-- legs -->
              <path class="ln" d="M82,210 L78,240" />
              <path class="ln" d="M118,210 L122,240" />
              <path class="ln" d="M70,240 L86,240" />
              <path class="ln" d="M114,240 L130,240" />
              <!-- arms -->
              <path class="ln" d="M38,150 L14,138" />
              <path class="ln" d="M162,150 L186,138" />
              <!-- body -->
              <path id="eg-body" class="eggbody" d="M100,14 C62,14 40,66 40,120 C40,178 66,214 100,214 C134,214 160,178 160,120 C160,66 138,14 100,14 Z" />
              <!-- pants band (drops on reveal) -->
              <g id="eg-pants">
                <path class="pants" d="M44,168 C44,200 66,214 100,214 C134,214 156,200 156,168 L156,196 C156,206 132,214 100,214 C68,214 44,206 44,196 Z" />
              </g>
              <!-- eyes -->
              <circle id="eg-eyeL" class="eye" cx="82" cy="98" r="4.5" />
              <circle id="eg-eyeR" class="eye" cx="118" cy="98" r="4.5" />
              <!-- mouth -->
              <ellipse id="eg-mouth" class="mouth" cx="100" cy="150" rx="17" ry="11" />
            </g>

            <!-- BACK view (nude egg) -->
            <g id="eg-back" hidden>
              <!-- legs -->
              <path class="ln" d="M82,210 L78,240" />
              <path class="ln" d="M118,210 L122,240" />
              <path class="ln" d="M70,240 L86,240" />
              <path class="ln" d="M114,240 L130,240" />
              <!-- dropped pants around ankles -->
              <ellipse class="pants" cx="100" cy="236" rx="46" ry="10" />
              <!-- arms -->
              <path class="ln" d="M38,150 L16,160" />
              <path class="ln" d="M162,150 L184,160" />
              <!-- body -->
              <path class="eggbody" d="M100,14 C62,14 40,66 40,120 C40,178 66,214 100,214 C134,214 160,178 160,120 C160,66 138,14 100,14 Z" />
              <!-- butt cheeks -->
              <path class="ln" d="M100,150 C86,150 74,168 74,188 C74,204 86,212 100,212" />
              <path class="ln" d="M100,150 C114,150 126,168 126,188 C126,204 114,212 100,212" />
              <!-- crack -->
              <path class="ln" d="M100,150 L100,212" />
            </g>

            <!-- party hat (birthday) -->
            <g id="eg-hat" hidden>
              <path class="hat" d="M100,-26 L128,26 L72,26 Z" />
              <circle class="hat-pom" cx="100" cy="-30" r="7" />
              <path class="ln" d="M78,14 L122,14" />
              <path class="ln" d="M80,2 L120,2" />
            </g>
          </svg>
        </div>

        <!-- egg source / basket -->
        <div id="basket-area" class="basket-area">
          <div id="basket" class="basket" aria-label="Egg basket">
            <div class="basket-lip" aria-hidden="true"></div>
            <div id="eggs" class="eggs"></div>
            <div class="basket-front" aria-hidden="true">EGGS</div>
          </div>
        </div>
      </div>
    </div>

    <!-- mute control -->
    <button id="mute" class="mute" aria-label="Sound on/off" title="Sound">SND: ON</button>
  </div>

  <!-- drag layer (eggs move here while dragging) -->
  <div id="drag-layer" class="drag-layer" aria-hidden="true"></div>

  <!-- party effects -->
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <div id="balloons" class="balloons" aria-hidden="true"></div>
  <div id="bday-text" class="bday-text" aria-hidden="true"></div>

  <!-- dialog layer -->
  <div id="dialog-layer" class="dialog-layer" hidden>
    <div id="dialogs"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
