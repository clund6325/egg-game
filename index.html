<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8f9aa3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Egg" />
  <meta name="description" content="Egg." />
  <title>Egg</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- pale dithered desktop fills the viewport; the scaled 960x540 stage sits centered -->
  <div id="desk">
    <div id="stage" aria-label="Egg">

      <!-- window chrome -->
      <div class="win-chrome">
        <div class="titlebar">
          <div class="closebox"></div>
          <div class="titlebar-lines"></div>
          <div class="title">Egg</div>
          <div class="titlebar-lines"></div>
        </div>
        <div class="menubar" id="menubar">
          <span>File</span><span>Egg</span><span>Special</span>
        </div>
      </div>

      <!-- heads-up text -->
      <div class="hud">
        <div id="feed-title" class="feed-title">FEED EGGS</div>
        <div class="counter-wrap"><span id="counter" class="counter">0 EGGS</span></div>
      </div>

      <!-- line-art layer: Eggman + basket -->
      <svg id="eggSvg" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- egg basket / source -->
        <g id="basketArt">
          <path class="ln2" d="M690,470 L890,470 L872,388 L708,388 Z"/>
          <line class="ln2" x1="700" y1="418" x2="880" y2="418"/>
          <path class="ln2" d="M700,388 q90,-26 180,0"/>
          <text x="790" y="452" class="basket-label">EGGS</text>
        </g>

        <!-- EGGMAN: one model, layered groups -->
        <g id="eggman">
          <g id="eg-bob">
            <g id="eg-turn">

              <!-- legs stay planted -->
              <g id="eg-legs">
                <g id="eg-leg-l">
                  <line class="ln" x1="-46" y1="28" x2="-46" y2="92"/>
                  <ellipse class="foot" cx="-52" cy="98" rx="30" ry="11"/>
                </g>
                <g id="eg-leg-r">
                  <line class="ln" x1="46" y1="28" x2="46" y2="92"/>
                  <ellipse class="foot" cx="52" cy="98" rx="30" ry="11"/>
                </g>
              </g>

              <!-- trousers: worn on hips, drop straight to ankles -->
              <g id="eg-pants" hidden>
                <path class="pants" d="M-72,6 L72,6 L70,74 L14,74 L8,30 L-8,30 L-14,74 L-70,74 Z"/>
                <line class="ln" x1="-72" y1="20" x2="72" y2="20"/>
              </g>

              <!-- torso bends over the hips -->
              <g id="eg-torso">
                <!-- body: squat wide egg -->
                <path id="eg-body" class="eggbody"
                  d="M0,-182 C-92,-182 -128,-96 -128,-26 C-128,44 -70,44 0,44 C70,44 128,44 128,-26 C128,-96 92,-182 0,-182 Z"/>

                <!-- tiny arms -->
                <g id="eg-arms">
                  <path class="ln" d="M-120,-58 q-34,6 -46,30"/>
                  <path class="ln" d="M120,-58 q34,6 46,30"/>
                </g>
                <!-- chaos: extra tiny arm -->
                <path id="eg-arm3" class="ln" d="M120,-30 q34,10 40,34" hidden/>
                <!-- chaos: necktie -->
                <path id="eg-tie" class="tie" d="M0,-96 l-10,10 l10,40 l10,-40 z" hidden/>

                <!-- FRONT face -->
                <g id="eg-face">
                  <circle class="eye" cx="-30" cy="-112" r="17"/>
                  <circle class="eye" cx="30" cy="-112" r="17"/>
                  <circle class="pupil" cx="-30" cy="-110" r="6"/>
                  <circle class="pupil" cx="30" cy="-110" r="6"/>
                  <ellipse id="eggman-mouth" class="mouth" cx="0" cy="-40" rx="44" ry="36"/>
                  <!-- pinched CHEW mouth: visible art only; NOT used for collision -->
                  <path id="eggman-chew" class="chew" d="M-26,-40 Q0,-47 26,-40 Q0,-33 -26,-40 Z" hidden/>
                </g>

                <!-- front bush (between legs), revealed in the payoff -->
                <g id="eg-bush" hidden>
                  <path class="bush" d="M0,26 l-4,20 M0,26 l4,20 M0,24 l-12,16 M0,24 l12,16 M0,22 l-18,10 M0,22 l18,10 M0,28 l0,20"/>
                </g>

                <!-- BACK view: two round cheeks + bold crack + hole -->
                <g id="eg-butt" hidden>
                  <path class="ln" d="M0,-52 C-46,-40 -52,10 -30,44"/>
                  <path class="ln" d="M0,-52 C46,-40 52,10 30,44"/>
                  <line class="ln" x1="0" y1="-52" x2="0" y2="44" stroke-width="6"/>
                  <circle id="eg-hole" class="hole" cx="0" cy="2" r="12"/>
                  <!-- chaos: tiny party hat on the butt -->
                  <path id="eg-butt-hat" class="hat" d="M40,-14 L58,20 L22,20 Z" hidden/>
                </g>

                <!-- party hat on head -->
                <g id="eg-hat" hidden>
                  <path class="hat" d="M0,-250 L44,-176 L-44,-176 Z"/>
                  <circle class="pompom" cx="0" cy="-256" r="10"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- chaos: a second tiny eggman that wanders the background -->
        <g id="mini-eggman" hidden>
          <path class="eggbody" d="M0,-40 C-20,-40 -28,-20 -28,-6 C-28,10 -16,10 0,10 C16,10 28,10 28,-6 C28,-20 20,-40 0,-40 Z"/>
          <circle class="eye" cx="-7" cy="-22" r="4"/>
          <circle class="eye" cx="7" cy="-22" r="4"/>
          <ellipse class="mouth" cx="0" cy="-6" rx="9" ry="7"/>
          <line class="ln" x1="-9" y1="10" x2="-9" y2="22"/>
          <line class="ln" x1="9" y1="10" x2="9" y2="22"/>
        </g>

        <!-- chaos finale props are injected here and cleared each run -->
        <g id="props"></g>
      </svg>

      <!-- eggs live here (HTML, logical coords) -->
      <div id="play"></div>

      <!-- dialogs -->
      <div id="dialogs"></div>

      <!-- party effects live inside the stage so they scale with it -->
      <canvas id="confetti" class="confetti"></canvas>
      <div id="balloons" class="balloons"></div>
      <div id="bday-text" class="bday-text"></div>
    </div>
  </div>

  <!-- portrait blocker (phones): outside the stage, never scaled -->
  <div id="rotate" class="rotate">
    <svg viewBox="0 0 120 120" class="rotate-icon" aria-hidden="true">
      <rect x="34" y="14" width="52" height="92" rx="6" class="ln"/>
      <line x1="34" y1="26" x2="86" y2="26" class="ln"/>
      <line x1="34" y1="94" x2="86" y2="94" class="ln"/>
      <path class="ln" d="M18,64 a44,44 0 0 1 84,-8"/>
      <path class="ln" d="M102,40 l0,18 l-18,0"/>
    </svg>
    <div class="rotate-text">ROTATE PHONE<br/>TO FEED EGGS</div>
  </div>

  <!-- mute control (outside stage) -->
  <button id="mute" class="mute" aria-label="Sound on/off">SND: ON</button>

  <!-- drag layer (unused for positioning now, kept for z-order overlays) -->
  <div id="drag-layer" class="drag-layer" aria-hidden="true"></div>

  <script src="game.js"></script>
</body>
</html>
